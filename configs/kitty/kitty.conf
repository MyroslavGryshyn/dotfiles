# kitty.conf — migrated from configs/alacritty/alacritty.toml
# Rosé Pine (moon-ish) palette, JetBrainsMono Nerd Font, matching the old Alacritty setup.
#
# Not portable from Alacritty (kitty has no equivalent, left out on purpose):
#   - [window].blur           kitty (upstream) does not support background blur.
#   - [window].startup_mode = "Maximized"
#       kitty has no maximize-on-launch config key. Launch maximized with:
#         kitty --start-as=maximized
#       (there's a `kitty-max` alias for this in configs/zsh/bash_aliases)
#   - [colors].hints / footer_bar / line_indicator / search
#       These configure Alacritty's built-in vi-mode UI, which kitty doesn't have.
#       kitty's closest analog (the `hints` kitten) takes its own CLI color flags,
#       not kitty.conf directives.

# === Environment / behaviour ===
term xterm-256color
# kitty already reloads kitty.conf on save by default — no live_config_reload equivalent needed.

# === Font ===
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0

# === Window ===
background_opacity 0.8
window_padding_width 2
hide_window_decorations no

# === Scrolling ===
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# === Bell ===
visual_bell_duration 0.1
visual_bell_color #f6c177
enable_audio_bell no

# === Colors (Rosé Pine) ===
foreground              #e0def4
background              #232136
selection_foreground    #e0def4
selection_background    #44415a

cursor                  #56526e
cursor_text_color       #e0def4

# black
color0  #393552
color8  #6e6a86
# red
color1  #eb6f92
color9  #eb6f92
# green
color2  #3e8fb0
color10 #3e8fb0
# yellow
color3  #f6c177
color11 #f6c177
# blue
color4  #9ccfd8
color12 #9ccfd8
# magenta
color5  #c4a7e7
color13 #c4a7e7
# cyan
color6  #ea9a97
color14 #ea9a97
# white
color7  #e0def4
color15 #e0def4

# === Tmux session switching (was Alacritty [[keyboard.bindings]]) ===
map cmd+shift+n send_text all \x01)
map cmd+shift+p send_text all \x01(

# Claude Code CLI's image-clipboard paste (via pngpaste) is wired to literal
# Ctrl+V, not kitty's own paste_from_clipboard action -- the latter only
# injects clipboard *text* via bracketed paste, so it silently no-ops when
# the clipboard holds an image. Sending Cmd+V as a raw Ctrl+V byte makes
# Claude Code's own handler (which checks the clipboard itself) fire for
# both text and images -- but that byte is also zsh's edit-command-line key
# and vim's literal-insert key, so sending it unconditionally breaks Cmd+V
# everywhere that isn't Claude Code (see smart_paste.py for the full story).
# smart_paste.py checks what's actually in the foreground (including one
# level into a tmux pane) and only sends the raw byte for Claude Code,
# falling back to kitty's normal clipboard paste otherwise.
map cmd+v kitten smart_paste.py
